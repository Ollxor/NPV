name: NPV English Web Feed

on:
  schedule:
    - cron: '30 6 * * *'  # 06:30 UTC, offset from the Swedish Slack job
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not write feed.json)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  web-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build feed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python src/web_feed.py

      - name: Commit updated feed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NPV Bot"
          git add docs/data/feed.json data/seen_web.json data/archive.json data/fetch_cache.json data/source_health.json
          git diff --staged --quiet || git commit -m "chore: update English web feed [skip ci]"
          git pull --rebase origin main
          git push
