name: NPV Quarterly Trend Analysis

on:
  schedule:
    # 1st of January, April, July, October at 08:00 UTC (once per quarter).
    # NB: cron treats day-of-month AND day-of-week as OR when both are set,
    # so "first Monday" can't be expressed here — a fixed date is used instead.
    - cron: '0 8 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not post to Slack)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  trends:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic requests

      - name: Run quarterly trend analysis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python src/quarterly_trends.py

      - name: Commit quarterly analysis to pages
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NPV Bot"
          git add docs/data/quarterly.json
          git diff --staged --quiet || git commit -m "chore: update quarterly analysis [skip ci]"
          git pull --rebase origin main
          git push
